# 本机内存有限，构建期压住 JVM 堆，不常驻 daemon。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=37.0
# 注意：aarch64 host 上如果 SDK 自带的 aapt2 跑不起来，用 qemu 包装一份，
# 再通过 build.sh 自动追加 -Pandroid.aapt2FromMavenOverride=... 覆盖，
# 不要把这个本地路径写进仓库。

# R8 完全模式：最强混淆与优化
android.enableR8.fullMode=true
